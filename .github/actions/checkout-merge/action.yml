name: Checkout reviewed PR

description: >
  For manual test runs, verify a reviewed PR head SHA and merge that exact
  commit into the base SHA returned by GitHub. Requires an existing checkout
  of the workflow commit. Ordinary PR runs should use the event merge commit.

inputs:
  pr_number:
    description: Optional PR number for a manual test run
    required: false
  head_sha:
    description: Full reviewed head commit SHA, required with pr_number
    required: false

runs:
  using: composite
  steps:
    - name: Verify and merge reviewed PR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEWED_HEAD_SHA: ${{ inputs.head_sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -z "$PR_NUMBER" ] && [ -z "$REVIEWED_HEAD_SHA" ]; then
          echo "No PR requested; testing the workflow commit."
          exit 0
        fi
        if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || ! [[ "$REVIEWED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::Provide both a positive pr_number and its full reviewed head_sha."
          exit 1
        fi
        REVIEWED_HEAD_SHA="${REVIEWED_HEAD_SHA,,}"

        PR_DATA=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
        BASE_SHA=$(jq -er '.base.sha' <<< "$PR_DATA")
        HEAD_SHA=$(jq -er '.head.sha' <<< "$PR_DATA")
        if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::GitHub did not return valid base and head commit SHAs."
          exit 1
        fi
        if [ "$HEAD_SHA" != "$REVIEWED_HEAD_SHA" ]; then
          echo "::error::PR head changed. Review the current commit and dispatch again with its SHA."
          exit 1
        fi

        # Resolve the PR once, then fetch only immutable commit IDs. Even if the
        # PR changes after verification, its newer code cannot enter this run.
        # Fetch complete ancestry so old fork points work without shallow merges.
        fetch_options=(--no-tags --no-recurse-submodules)
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          fetch_options+=(--unshallow)
        fi
        git fetch "${fetch_options[@]}" origin "$BASE_SHA" "$HEAD_SHA"
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git checkout --detach "$BASE_SHA"
        git merge --no-ff --no-edit "$HEAD_SHA"

        echo "Test merge: base=$BASE_SHA reviewed_head=$HEAD_SHA"
        git log -1 --oneline
